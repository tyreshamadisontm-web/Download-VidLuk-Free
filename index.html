<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidLuk</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0f14;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(900px, 92%);
      margin: 60px auto;
    }

    .card {
      background: #171a21;
      border: 1px solid #292e38;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .description {
      color: #9ca3af;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #343a46;
      background: #0d0f14;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    button {
      padding: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #computerButton {
      background: #fff;
      color: #111;
    }

    #serverButton {
      background: #292e38;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #0d0f14;
      color: #b9c0cc;
      white-space: pre-wrap;
    }

    .clip {
      margin-top: 12px;
      padding: 15px;
      border-radius: 10px;
      background: #10131a;
      border: 1px solid #292e38;
    }

    .clip a {
      display: inline-block;
      margin-top: 10px;
      color: #fff;
    }

    @media (max-width: 600px) {
      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>🎬 VidLuk</h1>

      <div class="description">
        Free personal video clip generator
      </div>

      <label for="videoUrl">
        Public Video URL
      </label>

      <input
        id="videoUrl"
        type="url"
        placeholder="Paste a public video URL"
      >

      <div class="buttons">

        <button id="computerButton">
          💻 Run on Computer
        </button>

        <button id="serverButton">
          ☁️ Run on Free Server
        </button>

      </div>

      <div id="status" class="status">
        Ready.
      </div>

      <div id="clips"></div>

    </div>

  </div>

  <script>
    const videoUrl =
      document.getElementById("videoUrl");

    const statusBox =
      document.getElementById("status");

    const clipsBox =
      document.getElementById("clips");

    const computerButton =
      document.getElementById("computerButton");

    const serverButton =
      document.getElementById("serverButton");


    function setStatus(message) {
      statusBox.textContent = message;
    }


    async function processVideo(mode) {

      const url =
        videoUrl.value.trim();

      if (!url) {
        setStatus(
          "Paste a public video URL first."
        );
        return;
      }

      computerButton.disabled = true;
      serverButton.disabled = true;

      clipsBox.innerHTML = "";

      try {

        setStatus(
          mode === "computer"
            ? "Computer mode selected."
            : "Sending video to the free server..."
        );

        if (mode === "computer") {

          setStatus(
            "Computer processing will be connected next."
          );

          return;
        }

        const response =
          await fetch("/api/process", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              url: url
            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Video processing failed."
          );

        }


        setStatus(
          data.message ||
          "Clips generated."
        );


        if (data.clips) {

          data.clips.forEach(
            (clip) => {

              const div =
                document.createElement(
                  "div"
                );

              div.className =
                "clip";


              div.innerHTML = `
                <strong>${clip.name}</strong>
                <br>
                Start: ${clip.start}s
                <br>
                Duration: ${clip.duration}s
                <br>
                <a href="${clip.url}" download>
                  ⬇️ Download ${clip.name}
                </a>
              `;


              clipsBox.appendChild(div);

            }
          );

        }

      } catch (error) {

        setStatus(
          "Error: " +
          error.message
        );

      } finally {

        computerButton.disabled = false;
        serverButton.disabled = false;

      }

    }


    computerButton.addEventListener(
      "click",
      () => processVideo("computer")
    );


    serverButton.addEventListener(
      "click",
      () => processVideo("server")
    );

  </script>

</body>
</html>
