<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VidLuk Free Clipper</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef2ff;background:#090b12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b2d 0,#090b12 48%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 18px 70px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.brand h1{margin:0;font-size:34px}.brand p{color:#aab2c8;margin:7px 0}.badge{border:1px solid #2e3854;border-radius:999px;padding:8px 12px;color:#8ef0b0;background:#101727}.card{background:#10131d;border:1px solid #242b3e;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 12px 35px #0004}.drop{border:2px dashed #35405c;border-radius:16px;padding:28px;text-align:center;cursor:pointer}.drop.drag{border-color:#8b9cff;background:#151a2a}.drop input{display:none}.btn{border:0;border-radius:11px;padding:11px 15px;background:#6674ff;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#222a3c}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:15px}label{font-size:13px;color:#aeb7cc;display:block;margin-bottom:5px}select,input[type=text]{width:100%;background:#0c1019;color:#fff;border:1px solid #303950;border-radius:10px;padding:10px}video{width:100%;max-height:430px;background:#000;border-radius:14px}.status{font-size:14px;color:#b7c0d5;min-height:22px}.progress{height:8px;background:#20273a;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#7f8cff;transition:width .2s}.clip{display:grid;grid-template-columns:220px 1fr auto;gap:14px;align-items:center;border-top:1px solid #252c40;padding:14px 0}.clip:first-child{border-top:0}.thumb{aspect-ratio:9/16;background:#080a0f;border-radius:10px;overflow:hidden}.thumb video{height:100%;object-fit:cover}.score{font-size:25px;font-weight:800}.muted{color:#8f99af}.small{font-size:12px;color:#8791a8}.hidden{display:none!important}.notice{padding:11px 13px;border-radius:10px;background:#151b2b;color:#bac4dc}.warn{background:#2b2115;color:#f3cf8a}.good{background:#12251a;color:#a7efbf}.danger{background:#2b171b;color:#ffadb5}@media(max-width:700px){.hero{display:block}.clip{grid-template-columns:110px 1fr}.clip .actions{grid-column:1/-1}.brand h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="brand"><h1>VidLuk Free Clipper</h1><p>Free-first • GitHub + Render • browser video processing</p></div><div class="badge">NO PAID API KEY</div></header>
<div class="card"><div id="drop" class="drop"><strong>Drop a video here</strong><div class="muted">or click to choose an MP4/MOV/WebM file</div><input id="file" type="file" accept="video/*"></div><div id="fileInfo" class="notice hidden"></div></div>
<div id="work" class="card hidden">
<video id="sourceVideo" controls></video>
<div class="controls"><div><label>Output</label><select id="ratio"><option value="9:16">9:16 Shorts / Reels / TikTok</option><option value="16:9">16:9 YouTube</option><option value="1:1">1:1 Square</option></select></div><div><label>Clip length</label><select id="length"><option value="30">30 seconds</option><option value="45">45 seconds</option><option value="60" selected>60 seconds</option></select></div><div><label>Captions</label><select id="captions"><option value="on" selected>Burn captions when transcript exists</option><option value="off">No captions</option></select></div></div>
<div class="row" style="margin-top:15px"><button class="btn" id="analyze">Find viral moments</button><button class="btn secondary" id="transcribe">Start browser transcription</button></div>
<div id="status" class="status" style="margin-top:12px"></div><div class="progress"><div id="bar" class="bar"></div></div>
<div id="transcriptBox" class="notice hidden" style="margin-top:12px"></div>
</div>
<div id="results" class="card hidden"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Suggested clips</h2><button class="btn secondary" id="renderAll">Render all</button></div><div id="clips"></div></div>
<div id="renderCard" class="card hidden"><h2>Rendering</h2><div id="renderStatus" class="status"></div><div class="progress"><div id="renderBar" class="bar"></div></div></div>
</div>
<script type="module">
import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js';
import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js';

const $=id=>document.getElementById(id);
let file=null, duration=0, transcript=[], clips=[], ffmpeg=null, ffmpegReady=false, recognition=null, recognizing=false;
const setStatus=(s,p=null)=>{ $('status').textContent=s||''; if(p!==null)$('bar').style.width=Math.max(0,Math.min(100,p))+'%'; };
const setRender=(s,p=null)=>{ $('renderStatus').textContent=s||''; if(p!==null)$('renderBar').style.width=Math.max(0,Math.min(100,p))+'%'; };
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
$('drop').onclick=()=>$('file').click();
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};
$('drop').ondragleave=()=>$('drop').classList.remove('drag');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};
$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};
function loadFile(f){file=f;const url=URL.createObjectURL(f);$('sourceVideo').src=url;$('work').classList.remove('hidden');$('results').classList.add('hidden');$('fileInfo').classList.remove('hidden');$('fileInfo').textContent=`Loaded: ${f.name} • ${(f.size/1024/1024).toFixed(1)} MB`;setStatus('Ready. For best results use a reasonably sized video.');}
$('sourceVideo').onloadedmetadata=()=>{duration=$('sourceVideo').duration;setStatus(`Video length: ${format(duration)}. Click “Find viral moments”.`)};
function format(s){s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}

async function audioScores(){
  const v=$('sourceVideo'); const len=Math.min(duration,600); const step=5; const scores=[];
  // Use the video element's audio through Web Audio. If autoplay/security prevents it, use evenly spaced candidates.
  try{const ac=new AudioContext();const src=ac.createMediaElementSource(v);const analyser=ac.createAnalyser();analyser.fftSize=1024;src.connect(analyser);analyser.connect(ac.destination);const data=new Uint8Array(analyser.fftSize);
    for(let t=0;t<len;t+=step){v.currentTime=t;await new Promise(r=>setTimeout(r,120));analyser.getByteTimeDomainData(data);let sum=0;for(const x of data){const z=(x-128)/128;sum+=z*z}scores.push({t,rms:Math.sqrt(sum/data.length)});} src.disconnect();ac.close();
    return scores;
  }catch(e){return Array.from({length:Math.ceil(len/step)},(_,i)=>({t:i*step,rms:0.05}));}
}
function makeClips(){
  const L=Number($('length').value); const maxStart=Math.max(0,duration-L); const step=Math.max(5,Math.floor(L/3));
  const candidates=[];
  for(let s=0;s<=maxStart;s+=step)candidates.push({start:s,end:Math.min(duration,s+L)});
  // If transcript exists, favor segments containing more words and strong keywords.
  return candidates.map((c,i)=>{const words=transcript.filter(w=>w.start>=c.start&&w.end<=c.end);const text=words.map(w=>w.word).join(' ');const lower=text.toLowerCase();const emotional=(lower.match(/(wow|love|hate|never|always|secret|truth|crazy|important|mistake|warning|best|worst|amazing|shocking|why|how|because|learned|changed|realize)/g)||[]).length;const q=(text.match(/\?/g)||[]).length;const density=words.length?Math.min(1,words.length/Math.max(1,L*2.2)):0.35;const score=Math.min(99,Math.round(45+density*28+Math.min(15,emotional*3)+Math.min(8,q*4)+(i%3)*2));const reason=words.length?`Strong speech density${emotional?' + emotional/curiosity language':''}.`:'Candidate selected from the video timeline; add a transcript for smarter scoring.';return {id:'clip-'+i,start:c.start,end:c.end,duration:c.end-c.start,score,title: text?text.slice(0,72)+(text.length>72?'…':''):`Viral candidate ${i+1}`,reason,text};}).sort((a,b)=>b.score-a.score).slice(0,5);
}
$('analyze').onclick=async()=>{if(!file)return; $('analyze').disabled=true;setStatus('Analyzing audio and finding strong moments…',10);await new Promise(r=>setTimeout(r,50));await audioScores();setStatus('Scoring candidate clips…',55);clips=makeClips();setStatus(`Found ${clips.length} candidate clips.`,100);renderClipList();$('results').classList.remove('hidden');$('analyze').disabled=false;};

function renderClipList(){const box=$('clips');box.innerHTML='';clips.forEach((c,i)=>{const el=document.createElement('div');el.className='clip';el.innerHTML=`<div class="thumb"><video src="${$('sourceVideo').src}#t=${c.start},${Math.min(c.end,c.start+4)}" muted></video></div><div><div class="row"><span class="score">${c.score}</span><span class="muted">Viral Score</span></div><strong>${escapeHtml(c.title)}</strong><div class="small">${format(c.start)} – ${format(c.end)} • ${escapeHtml(c.reason)}</div></div><div class="actions row"><button class="btn" data-render="${i}">Render MP4</button><button class="btn secondary" data-play="${i}">Preview</button></div>`;box.appendChild(el)});box.querySelectorAll('[data-render]').forEach(b=>b.onclick=()=>renderClip(clips[Number(b.dataset.render)]));box.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>previewClip(clips[Number(b.dataset.play)]));}
function previewClip(c){const v=$('sourceVideo');v.currentTime=c.start;v.play();setTimeout(()=>{v.pause()},(c.end-c.start)*1000)}

async function startTranscription(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){$('transcriptBox').classList.remove('hidden');$('transcriptBox').textContent='This browser does not expose Speech Recognition. You can still create clips using audio-based detection.';return;}
  if(recognizing)return; recognizing=true; transcript=[]; $('transcribe').disabled=true; setStatus('Listening for speech… play the video and let the browser transcribe it.');
  recognition=new SR(); recognition.continuous=true; recognition.interimResults=true; recognition.lang='en-US'; let last=0;
  recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const text=r[0].transcript.trim();const now=$('sourceVideo').currentTime;const words=text.split(/\s+/).filter(Boolean);let t=last||Math.max(0,now-Math.max(1,words.length/2));for(const word of words){const end=t+0.45;transcript.push({word,start:t,end});t=end}last=t;}} updateTranscript();};
  recognition.onerror=e=>{setStatus('Speech recognition stopped: '+e.error+'. You can still use audio detection.');stopRecognition()};
  recognition.onend=()=>{if(recognizing){try{recognition.start()}catch(e){}}};
  try{recognition.start();$('sourceVideo').play()}catch(e){setStatus('Could not start speech recognition.');stopRecognition();}
}
function stopRecognition(){recognizing=false;$('transcribe').disabled=false;if(recognition){try{recognition.stop()}catch(e){} }$('sourceVideo').pause();updateTranscript();}
function updateTranscript(){const text=transcript.map(w=>w.word).join(' ');$('transcriptBox').classList.remove('hidden');$('transcriptBox').innerHTML=`<strong>Transcript:</strong> ${escapeHtml(text.slice(-1200))||'No finalized speech yet.'}`;}
$('transcribe').onclick=()=>recognizing?stopRecognition():startTranscription();

// Correct the wasm URL string without relying on template parsing quirks.
async function ensureFFmpeg(){if(ffmpegReady)return; if(!crossOriginIsolated)throw new Error('Render security headers are missing.');ffmpeg=new FFmpeg();ffmpeg.on('progress',({progress})=>setRender('Rendering video…',Math.round(progress*100)));$('renderCard').classList.remove('hidden');setRender('Loading free browser video engine…',5);const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';const core=await toBlobURL(base+'/ffmpeg-core.js','text/javascript');const wasm=await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm');await ffmpeg.load({coreURL:core,wasmURL:wasm});ffmpegReady=true;}
function assForClip(c){const cues=transcript.filter(w=>w.start>=c.start&&w.end<=c.end);let body='';for(let i=0;i<cues.length;i+=4){const group=cues.slice(i,i+4);if(!group.length)continue;const st=group[0].start-c.start,en=group[group.length-1].end-c.start;const ts=x=>{x=Math.max(0,x);const h=Math.floor(x/3600),m=Math.floor((x%3600)/60),s=Math.floor(x%60),cs=Math.floor((x-Math.floor(x))*100);return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`};body+=`Dialogue: 0,${ts(st)},${ts(en)},Default,,0,0,0,,${group.map(w=>w.word).join('\\N')}\n`;}return `[Script Info]\nScriptType: v4.00+\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: Default,Arial,54,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,1,0,2,60,60,110,1\n[Events]\nFormat: Layer, Start, End, Style, Text\n${body}`;}
async function renderClip(c){$('renderCard').classList.remove('hidden');try{await ensureFFmpeg();const input='input.'+(file.name.split('.').pop()||'mp4');const out=`vidluk-${Date.now()}.mp4`;await ffmpeg.writeFile(input,await fetchFile(file));setRender('Preparing clip…',10);const vf=$('ratio').value==='9:16'?'scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920':$('ratio').value==='1:1'?'scale=1080:1080:force_original_aspect_ratio=increase,crop=1080:1080':'scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080';let filters=vf;if($('captions').value==='on'&&transcript.length){const ass=assForClip(c);await ffmpeg.writeFile('captions.ass',new TextEncoder().encode(ass));filters+=`,subtitles=captions.ass`; }setRender('Cutting and encoding MP4…',20);await ffmpeg.exec(['-ss',String(c.start),'-i',input,'-t',String(c.end-c.start),'-vf',filters,'-c:v','libx264','-preset','ultrafast','-crf','28','-c:a','aac','-b:a','128k','-movflags','+faststart',out]);const data=await ffmpeg.readFile(out);const blob=new Blob([data.buffer],{type:'video/mp4'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=out;a.click();setRender('Done — MP4 downloaded.',100);setTimeout(()=>URL.revokeObjectURL(url),60000);try{await ffmpeg.deleteFile(input);await ffmpeg.deleteFile(out);if(transcript.length)await ffmpeg.deleteFile('captions.ass')}catch(e){} }catch(e){console.error(e);setRender('Render failed: '+e.message,0);}}
$('renderAll').onclick=async()=>{for(const c of clips)await renderClip(c)};
</script>
</body>
</html>
